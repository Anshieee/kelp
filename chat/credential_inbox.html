<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Private sign-in requests · Kelp</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #17251f; background: #f5f7f4; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(100% - 32px, 680px); margin: 0 auto; padding: 28px 0 56px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dce4dd; padding-bottom: 18px; }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: -.025em; }
    h2 { font-size: 1.1rem; margin: 0; }
    h3 { font-size: 1.08rem; overflow-wrap: anywhere; margin: 0; }
    p { line-height: 1.5; }
    .intro { color: #52645a; margin: 22px 0; }
    .card { background: #fff; border: 1px solid #dce4dd; border-radius: 14px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 8px #1735230c; }
    .pending { border-color: #d29b2e; }
    .status { color: #725016; font-weight: 700; margin: 10px 0; }
    .muted { color: #5c6b62; font-size: .92rem; }
    .field-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; }
    .field-list li { border: 1px solid #dce4dd; border-radius: 999px; padding: 6px 11px; font-size: .9rem; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input[type=password], input[type=text] { width: 100%; min-height: 48px; border: 1px solid #aab8ae; border-radius: 9px; padding: 10px 12px; color: #17251f; background: white; font: inherit; }
    input[type=checkbox] { width: 20px; height: 20px; accent-color: #246c4c; vertical-align: middle; }
    button { border: 0; border-radius: 9px; min-height: 48px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; color: white; background: #246c4c; }
    button.secondary { color: #26382d; background: #edf1ed; }
    button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 3px solid #246c4c; outline-offset: 3px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .signin button { width: 100%; margin-top: 12px; }
    [hidden] { display: none !important; }
    @media (max-width: 420px) { main { width: min(100% - 24px, 680px); padding-top: 18px; } .card { padding: 16px; } .actions { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
<main>
  <header><h1>Kelp</h1><div style="display:flex;align-items:center;gap:12px"><span id="connection" class="muted">Signed out</span><button id="signout" class="secondary" type="button" hidden>Sign out</button></div></header>
  <p class="intro">A browser is waiting at a sign-in form. Check the site and requested fields before sending anything. Secret values are never shown in a message, receipt, or request list.</p>
  <section id="signin" class="card signin" aria-labelledby="signinTitle">
    <h2 id="signinTitle">Sign in to review requests</h2>
    <label for="bearer">Owner sign-in token</label>
    <input id="bearer" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="signinButton" type="button">Continue</button>
    <p id="signinMessage" class="muted" role="status" aria-live="polite"></p>
  </section>
  <section id="inbox" hidden aria-labelledby="inboxTitle">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 id="inboxTitle">Sign-in requests</h2><button id="refresh" class="secondary" type="button">Refresh</button></div>
    <div id="requests" aria-live="polite"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function csrf() { return decodeURIComponent(document.cookie.match(/(?:^|;\s*)csrf=([^;]+)/)?.[1] || ""); }
  async function call(path, { method = "GET", body, bearer } = {}) {
    const headers = {};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (bearer) headers.Authorization = `Bearer ${bearer}`;
    else if (method !== "GET") headers["X-CSRF-Token"] = csrf();
    const response = await fetch(path, { method, credentials: "same-origin", headers, body: body === undefined ? undefined : JSON.stringify(body) });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error("Request could not be completed.");
    return data;
  }
  function when(value) { const date = new Date(value); return Number.isNaN(+date) ? "Expiry unavailable" : `Expires ${date.toLocaleString()}`; }
  async function signIn() {
    const input = $("bearer"), message = $("signinMessage"), token = input.value;
    if (!token) { message.textContent = "Enter the owner sign-in token."; return; }
    $("signinButton").disabled = true;
    try { await call("/api/auth/session", { method: "POST", bearer: token, body: { device_label: "Phone credential inbox" } });
      input.value = ""; showInbox(); await refresh();
    } catch { input.value = ""; message.textContent = "Sign-in failed. Check the token and try again."; }
    finally { $("signinButton").disabled = false; }
  }
  function cardFor(request) {
    const card = document.createElement("article"); card.className = `card${request.status === "pending" ? " pending" : ""}`;
    const title = document.createElement("h3"); title.textContent = request.origin;
    const status = document.createElement("p"); status.className = "status"; status.textContent = request.status === "pending" ? "Waiting on you" : request.status.replaceAll("_", " ");
    const destination = document.createElement("p"); destination.className = "muted"; destination.textContent = `Requested by the browser for ${request.origin}.`;
    const fields = document.createElement("ul"); fields.className = "field-list";
    for (const field of request.fields || []) { const item = document.createElement("li"); item.textContent = field.label; fields.append(item); }
    const intent = document.createElement("p"); intent.className = "muted";
    intent.textContent = request.submission?.enabled ? `Approval will fill the fields and press “${request.submission.label || "Submit"}”.` : "Approval will fill the fields only. The browser will not submit the form.";
    const expires = document.createElement("p"); expires.className = "muted"; expires.textContent = when(request.expires_at);
    card.append(title, status, destination, fields, intent, expires);
    if (request.status === "pending") {
      const form = document.createElement("form"), controls = [];
      for (const field of request.fields || []) {
        const label = document.createElement("label"); label.textContent = field.label;
        const input = document.createElement("input"); input.type = "password"; input.name = field.id; input.autocomplete = "new-password"; input.required = true; input.spellcheck = false;
        input.setAttribute("aria-label", `${field.label}, entered privately`); label.append(input); form.append(label); controls.push(input);
      }
      const saveWrap = document.createElement("label"); saveWrap.className = "muted";
      const save = document.createElement("input"); save.type = "checkbox"; save.disabled = (request.fields || []).some((field) => field.kind === "otp");
      saveWrap.append(save, document.createTextNode(" Save for this site")); form.append(saveWrap);
      const actions = document.createElement("div"); actions.className = "actions";
      const approve = document.createElement("button"); approve.type = "submit"; approve.textContent = "Approve & send";
      const deny = document.createElement("button"); deny.type = "button"; deny.className = "secondary"; deny.textContent = "Deny";
      const feedback = document.createElement("p"); feedback.className = "muted"; feedback.setAttribute("role", "status");
      actions.append(approve, deny); form.append(actions, feedback);
      form.addEventListener("submit", async (event) => {
        event.preventDefault(); approve.disabled = deny.disabled = true; feedback.textContent = "Sending privately…";
        const values = Object.fromEntries(controls.map((input) => [input.name, input.value]));
        try { await call(`/api/credential-requests/${encodeURIComponent(request.id)}/submit`, { method: "POST", body: { values, save: save.checked } }); feedback.textContent = "Sent. The browser will continue after the owner-authorized handoff."; await refresh(); }
        catch { feedback.textContent = "Could not send. The request may have expired; refresh to check."; }
        finally { controls.forEach((input) => { input.value = ""; }); }
      });
      deny.addEventListener("click", async () => {
        approve.disabled = deny.disabled = true; feedback.textContent = "Denying request…";
        try { await call(`/api/credential-requests/${encodeURIComponent(request.id)}/deny`, { method: "POST", body: {} }); await refresh(); }
        catch { feedback.textContent = "Could not deny. Refresh to check the request status."; approve.disabled = deny.disabled = false; }
        finally { controls.forEach((input) => { input.value = ""; }); }
      });
      card.append(form);
    }
    if (["completed", "failed", "denied", "expired"].includes(request.status)) {
      const release = document.createElement("button"); release.type = "button"; release.className = "secondary"; release.textContent = "Allow browser checks to resume";
      release.addEventListener("click", async () => { release.disabled = true; try { await call(`/api/credential-requests/${encodeURIComponent(request.id)}/release`, { method: "POST", body: {} }); await refresh(); } catch { release.disabled = false; } }); card.append(release);
    }
    return card;
  }
  async function refresh() {
    const box = $("requests"); box.replaceChildren();
    try { const { requests = [] } = await call("/api/credential-requests");
      if (!requests.length) { const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "No sign-in requests. New requests will appear here."; box.append(empty); return; }
      requests.forEach((request) => box.append(cardFor(request)));
    } catch { const error = document.createElement("p"); error.className = "muted"; error.setAttribute("role", "status"); error.textContent = "Could not load requests. Sign in again or refresh."; box.append(error); }
  }
  function showInbox() { $("signin").hidden = true; $("inbox").hidden = false; $("signout").hidden = false; $("connection").textContent = "Connected"; }
  async function resumeSession() {
    try { await call("/api/auth/devices"); showInbox(); await refresh(); } catch { /* require explicit sign-in */ }
  }
  $("signout").addEventListener("click", async () => {
    const button = $("signout"); button.disabled = true;
    try { await call("/api/auth/session", { method: "DELETE", body: {} }); }
    catch { /* The server may already have expired the session. */ }
    $("requests").replaceChildren(); $("inbox").hidden = true; $("signin").hidden = false;
    $("connection").textContent = "Signed out"; button.hidden = true; button.disabled = false;
  });
  $("signinButton").addEventListener("click", signIn); $("bearer").addEventListener("keydown", (event) => { if (event.key === "Enter") signIn(); }); $("refresh").addEventListener("click", refresh);
  void resumeSession();
</script>
</body>
</html>
