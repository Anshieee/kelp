# Netlify configuration for the Kelp demo deployment.
#
# Serves the Netlify Functions backend (/api/v1/*) and the mobile PWA in
# netlify/mobile/. No framework, no bundler, nothing to compile.

[build]
  publish = "netlify"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api-v1/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=3600"
