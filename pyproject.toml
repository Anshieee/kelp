[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kelp-assistant"
version = "0.0.0"
description = "Always-On Private Assistant: local-first agent kernel, skill contracts, dashboard"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5", "httpx>=0.27,<1", "cryptography>=46,<51"]

# One command sets up a development environment: `pip install -e ".[dev]"`.
# The three pins match .github/workflows/ci.yml exactly, so a local run gates
# with the same tool versions the CI gate uses. Bump them together.
[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1"]

[tool.setuptools.packages.find]
# Explicit include list: the repo root also holds non-package directories
# (deploy/ is a standalone stdlib script, netlify/ is static, tests/ and
# docs/ are not shipped), and flat-layout auto-discovery refuses to guess
# across multiple top-level packages.
include = [
  "chat*",
  "kernel*",
  "skills*",
  "openshell*",
  "payments*",
  "evals*",
  "demo*",
]

[tool.setuptools.package-data]
chat = ["credential_inbox.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Match the version declared in requires-python. The rule set is selected
# explicitly so a new ruff release cannot widen the gate on its own. These are
# the classic default groups: imports and syntax (E4), statements (E7),
# runtime errors (E9), and pyflakes (F). Line length is not gated.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["chat", "kernel", "openshell", "skills", "payments", "evals", "demo", "tools"]

# Pre-existing type debt, tracked as a per-module baseline. mypy is green on
# every module not listed below, so new modules and new files are checked from
# day one. Remove a module from this list when its errors are fixed; do not add
# modules to silence new errors.
[[tool.mypy.overrides]]
module = [
  "chat.api",
  "chat.cards",
  "chat.checkout",
  "chat.metrics",
  "chat.recovery",
  "chat.retention",
  "chat.scheduler",
  "chat.server",
  "chat.service",
  "chat.wallet",
  "demo.runner",
  "evals.cli",
  "evals.metrics",
  "evals.runner",
  "evals.scenarios",
  "kernel.usage",
  "payments.razorpay_gateway",
  "skills.builtin.docs_answer.answer",
  "skills.builtin.docs_answer.extract",
  "skills.builtin.docs_answer.retrieval",
  "skills.loader",
  "skills.policy",
]
ignore_errors = true
