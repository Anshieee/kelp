<!doctype html>
<html lang="en" data-skin="midnight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#141414" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kelp" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="/phone/manifest.webmanifest" />
    <link rel="icon" href="/phone/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/phone/icons/icon-192.png" />
    <link rel="preload" href="/phone/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kelp</title>
    <script>
      // Apply the stored skin before first paint (Midnight default).
      try {
        var skin = localStorage.getItem("kelp.phone.skin");
        if (skin === "meadow" || skin === "midnight") {
          document.documentElement.dataset.skin = skin;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", skin === "meadow" ? "#f6f8f6" : "#141414");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
