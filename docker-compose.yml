# KELP chat server — single-replica Compose deployment (KEL-16, M2-F).
#
#   docker compose up -d --no-build
#
# This file never builds. `docs/DEPLOY.md` §4 builds `kelp:<commit>` once with
# `docker build`, and records that tag in `/opt/kelp/.env` as `KELP_IMAGE` so the
# systemd unit, a manual start, and a rollback all name the same artifact. If
# `KELP_IMAGE` is unset, or the tag is not present on the host, startup fails
# loudly: pulling is disabled and there is no `kelp:local` fallback to quietly
# become a stale or unbuilt image.
#
# Two env files, two different jobs:
#
#   /opt/kelp/.env     Compose interpolation only: KELP_IMAGE,
#                      KELP_PUBLISH_PORT. Read by Compose itself (and by the
#                      systemd unit's EnvironmentFile). Never seen by the
#                      container. Template: deploy/compose.env.example.
#   deploy/kelp.env    Container environment: secrets and runtime config, mode
#                      0600, gitignored, excluded from the build context. It is
#                      not interpolated into this file and holds no deploy tag.
#
# State lives in the `kelp-data` volume, never in the image.
#
# Do not scale this service. The server takes an exclusive lock on
# `<KELP_DB_PATH>.lock` and the second instance exits with `database_locked`
# (exit 3) instead of sharing SQLite.

name: kelp

services:
  kelp:
    # Required: no default. A missing tag is an operator error, not a rebuild.
    image: ${KELP_IMAGE:?set KELP_IMAGE to a built tag (docs/DEPLOY.md section 4)}
    # Never reach out to a registry: a tag this host does not have is a failure
    # here, not a silent pull of whatever `kelp:<something>` means upstream.
    pull_policy: never

    env_file:
      - deploy/kelp.env
    restart: unless-stopped
    init: true

    # Bound to loopback: the only supported ingress is a TLS reverse proxy on
    # the same host. Change to 0.0.0.0 only behind a firewall you control.
    ports:
      - "127.0.0.1:${KELP_PUBLISH_PORT:-8765}:8765"

    volumes:
      - kelp-data:/data

    # The container filesystem is immutable; only /data and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0

    # The server cancels and settles in-flight turns before exiting.
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py", "--live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kelp-data:
    name: kelp-data
