name: repair bot

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to repair
        required: true
        type: string
  workflow_run:
    workflows: [ci]
    types: [completed]

# This workflow handles untrusted PR content only after validating the target
# is in this public repository. Keep the write token narrowly scoped.
permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve and validate pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/$REPOSITORY" --jq .visibility)
          if [[ "$visibility" != public ]]; then
            echo "Repair bot only operates on public repositories." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == workflow_run ]]; then
            number=$(jq -er '.workflow_run.pull_requests[0].number' "$EVENT_PATH")
          else
            number="$PR_NUMBER"
          fi

          pr=$(gh api "repos/$REPOSITORY/pulls/$number")
          read -r head_repo head_ref head_sha state < <(
            jq -r '[.head.repo.full_name, .head.ref, .head.sha, .state] | @tsv' <<< "$pr" |
              awk -F '\t' '{ print $1, $2, $3, $4 }'
          )
          if [[ "$state" != open ]]; then
            echo "Pull request is not open." >&2
            exit 1
          fi
          if [[ "$head_repo" != "$REPOSITORY" ]]; then
            echo "Fork pull requests are not eligible for repair." >&2
            exit 1
          fi
          printf 'number=%s\nref=%s\nsha=%s\n' "$number" "$head_ref" "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Aider
        run: python -m pip install --disable-pip-version-check aider-chat

      - name: Attempt repair (maximum 2 attempts)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "Repository secret OPENROUTER_API_KEY is not configured." >&2
            exit 1
          fi
          prompt="Repair the failing checks for pull request #$PR_NUMBER. Inspect the repository and make the smallest safe code changes needed. Do not run commands, tests, scripts, or application code. Do not access, print, modify, or infer secrets or credentials. Do not change CI, deployment, workflow, or security configuration. Do not add dependencies. If the failure cannot be confidently fixed from source inspection, make no changes."
          for attempt in 1 2; do
            if aider --model 'openrouter/nvidia/nemotron-3.5-super-vl:free' \
              --message "$prompt" --no-auto-commits --no-auto-lint \
              --no-auto-test --no-check-update; then
              break
            fi
            if [[ "$attempt" == 2 ]]; then
              echo "Repair failed after the maximum of 2 attempts." >&2
              exit 1
            fi
          done

      - name: Commit and push repair
        env:
          PR_REF: ${{ steps.pr.outputs.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No repair changes were produced."
            exit 0
          fi
          # Do not overwrite concurrent PR updates; normal push is intentionally
          # non-forced and branch protection may reject it.
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix: automated repair attempt'
          gh auth setup-git
          git push origin "HEAD:$PR_REF"
