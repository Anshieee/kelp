name: ci

# Every push, on any branch, and every pull request. A red run blocks merge
# through the required-check rule on main; this workflow only reports status.
on:
  push:
  pull_request:

# Least privilege: the gate reads the repo and nothing else. gitleaks needs
# pull-requests read to annotate a PR; it never writes.
permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Test fixtures that look like credentials are allowlisted by path
          # in this config; the default rules still run everywhere else.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          # Pinned: the auditor code must not change underneath a merge.
          # Advisory data is fetched fresh on purpose, so a newly published
          # advisory is meant to turn this job red.
          pip install pip-audit==2.10.1
      - name: Audit
        # The dependencies audited are the ones pyproject.toml declares, so
        # the check follows the manifest without a second list to keep in sync.
        run: python -m tools.audit_deps

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          # Pinned: ruff defaults change between releases, so an unpinned
          # install would silently change which rules gate a merge.
          pip install ruff==0.17.3
      - name: Ruff check
        run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev,browser]"
      - name: Mypy
        run: mypy chat kernel openshell skills payments evals tools

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  javascript:
    name: backend and mobile JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Check backend JavaScript syntax
        run: npm run check:demo
      - name: Backend JavaScript tests
        run: npm run test:demo
      - name: Mobile JavaScript contract tests
        run: npm run test:mobile-contract
