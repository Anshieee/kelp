      // Uniform pacing: the 25 s cut runs at 25/15 speed with every beat intact.
      const pace = (timeline, k) => {
        timeline.paused(false).timeScale(k);
        return gsap.timeline({ paused: true }).add(timeline, 0);
      };
      window.__timelines["s5"] = pace(tl, 25 / 15);
    })();
